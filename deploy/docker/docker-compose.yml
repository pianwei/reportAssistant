services:
  due-diligence-assistant:
    image: "${APP_IMAGE:-docker.io/library/due-diligence-assistant:20260814-intranet-v1}"
    container_name: "${CONTAINER_NAME:-due-diligence-assistant}"
    network_mode: host
    restart: always
    env_file:
      - "${APP_ENV_FILE:-.env.intranet}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8888}/api/v1/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${APP_PORT:-8888}"
